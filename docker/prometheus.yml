global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: 'atomic-seat-api'
    metrics_path: '/health'
    static_configs:
      - targets: ['api-1:4000', 'api-2:4000']
        labels:
          service: 'atomic-seat-api'

  - job_name: 'atomic-seat-worker'
    metrics_path: '/health'
    static_configs:
      - targets: ['worker:5000']
        labels:
          service: 'atomic-seat-worker'
