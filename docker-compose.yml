services:
  # MongoDB Atlas / Local Database
  mongo:
    image: mongo:7.0
    container_name: atomic-seat-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis (Distributed locks & Socket.io Pub/Sub adapter)
  redis:
    image: redis:7-alpine
    container_name: atomic-seat-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # API Instance 1
  api-1:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: atomic-seat-api-1
    restart: unless-stopped
    environment:
      - PORT=4000
      - NODE_ENV=production
      - INSTANCE_ID=api_container_01
      - MONGODB_URI=mongodb://mongo:27017/atomicseat
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=atomic_seat_production_cluster_secret_key_2026
      - LOCK_STRATEGY=mongo-atomic
      - WORKER_URL=http://worker:5000
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  # API Instance 2 (Simulating multi-container horizontal scale)
  api-2:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: atomic-seat-api-2
    restart: unless-stopped
    environment:
      - PORT=4000
      - NODE_ENV=production
      - INSTANCE_ID=api_container_02
      - MONGODB_URI=mongodb://mongo:27017/atomicseat
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=atomic_seat_production_cluster_secret_key_2026
      - LOCK_STRATEGY=mongo-atomic
      - WORKER_URL=http://worker:5000
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Nginx Load Balancer (Exposing port 4000 across api-1 and api-2)
  nginx:
    image: nginx:alpine
    container_name: atomic-seat-nginx
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2

  # Rush Worker (Standalone load generation service)
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: atomic-seat-worker
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - TARGET_API_URL=http://nginx:4000
      - MAX_RUSH_USERS=300
      - DEFAULT_DURATION_SECONDS=30
    depends_on:
      - nginx

  # Next.js Web Frontend
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:4000
        - NEXT_PUBLIC_WS_URL=http://localhost:4000
    container_name: atomic-seat-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - nginx

  # Optional Prometheus Monitoring Stack (start with --profile monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: atomic-seat-prometheus
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  # Optional Grafana Visual Dashboard (start with --profile monitoring)
  grafana:
    image: grafana/grafana:latest
    container_name: atomic-seat-grafana
    profiles: ["monitoring"]
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

volumes:
  mongo_data:
  redis_data:
