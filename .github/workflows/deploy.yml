name: Deploy to Google Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Required for Workload Identity Federation (keyless GCP auth)

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
  REPOSITORY: ${{ secrets.GCP_REPOSITORY || 'atomic-seat-repo' }}
  WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}

jobs:
  validate-and-deploy:
    name: Build, Test & Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Concurrency & Invariant Integration Tests
        run: npm run test:api

      - name: Build Workspaces
        run: |
          npm run build:api
          npm run build:worker

      # Authenticate to Google Cloud via Workload Identity Federation (NO JSON KEYS)
      - name: Google Cloud Authentication (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate Docker with Artifact Registry
        run: gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev" --quiet

      - name: Set Image Tag and Registry
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::8}" >> $GITHUB_ENV
          echo "REGISTRY=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}" >> $GITHUB_ENV

      # Build & Push API Image
      - name: Build and Push API Container
        run: |
          docker build -t ${{ env.REGISTRY }}/atomic-seat-api:${{ env.IMAGE_TAG }} -f api/Dockerfile .
          docker push ${{ env.REGISTRY }}/atomic-seat-api:${{ env.IMAGE_TAG }}

      # Build & Push Rush Worker Image
      - name: Build and Push Rush Worker Container
        run: |
          docker build -t ${{ env.REGISTRY }}/atomic-seat-worker:${{ env.IMAGE_TAG }} -f worker/Dockerfile .
          docker push ${{ env.REGISTRY }}/atomic-seat-worker:${{ env.IMAGE_TAG }}

      # Deploy API to Google Cloud Run
      - name: Deploy API Service to Cloud Run
        id: deploy-api
        run: |
          gcloud run deploy atomic-seat-api \
            --image=${{ env.REGISTRY }}/atomic-seat-api:${{ env.IMAGE_TAG }} \
            --platform=managed \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --port=4000 \
            --concurrency=20 \
            --max-instances=10 \
            --min-instances=1 \
            --timeout=3600 \
            --session-affinity \
            --allow-unauthenticated \
            --set-env-vars="NODE_ENV=production,MONGODB_URI=${{ secrets.MONGODB_URI }},REDIS_URL=${{ secrets.REDIS_URL }},JWT_SECRET=${{ secrets.JWT_SECRET }},LOCK_STRATEGY=${{ secrets.LOCK_STRATEGY || 'mongo-atomic' }},MAX_RUSH_USERS=300"
          
          API_URL=$(gcloud run services describe atomic-seat-api --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} --format='value(status.url)')
          echo "API_URL=${API_URL}" >> $GITHUB_ENV
          echo "API deployed to: ${API_URL}"

      # Deploy Rush Worker to Google Cloud Run
      - name: Deploy Rush Worker to Cloud Run
        id: deploy-worker
        run: |
          gcloud run deploy atomic-seat-worker \
            --image=${{ env.REGISTRY }}/atomic-seat-worker:${{ env.IMAGE_TAG }} \
            --platform=managed \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --port=5000 \
            --concurrency=80 \
            --max-instances=2 \
            --min-instances=0 \
            --timeout=300 \
            --allow-unauthenticated \
            --set-env-vars="NODE_ENV=production,TARGET_API_URL=${{ env.API_URL }},MAX_RUSH_USERS=300,DEFAULT_DURATION_SECONDS=30"

          WORKER_URL=$(gcloud run services describe atomic-seat-worker --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} --format='value(status.url)')
          echo "WORKER_URL=${WORKER_URL}" >> $GITHUB_ENV
          echo "Rush Worker deployed to: ${WORKER_URL}"

      # Update API Service with Worker URL for Proxy Routing
      - name: Link Worker URL to API Service
        run: |
          gcloud run services update atomic-seat-api \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --update-env-vars="WORKER_URL=${{ env.WORKER_URL }}" \
            --quiet

      # Build and Push Web Image with API Public URL
      - name: Build and Push Web Container
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="${{ env.API_URL }}" \
            --build-arg NEXT_PUBLIC_WS_URL="${{ env.API_URL }}" \
            -t ${{ env.REGISTRY }}/atomic-seat-web:${{ env.IMAGE_TAG }} \
            -f web/Dockerfile .
          docker push ${{ env.REGISTRY }}/atomic-seat-web:${{ env.IMAGE_TAG }}

      # Deploy Web Frontend to Google Cloud Run
      - name: Deploy Web Service to Cloud Run
        run: |
          gcloud run deploy atomic-seat-web \
            --image=${{ env.REGISTRY }}/atomic-seat-web:${{ env.IMAGE_TAG }} \
            --platform=managed \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --port=3000 \
            --concurrency=80 \
            --max-instances=5 \
            --min-instances=1 \
            --timeout=300 \
            --allow-unauthenticated \
            --set-env-vars="NODE_ENV=production,NEXT_PUBLIC_API_URL=${{ env.API_URL }},NEXT_PUBLIC_WS_URL=${{ env.API_URL }}"

          WEB_URL=$(gcloud run services describe atomic-seat-web --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} --format='value(status.url)')
          echo "================================================="
          echo "Deployment Complete!"
          echo "Web Frontend URL: ${WEB_URL}"
          echo "API URL:          ${{ env.API_URL }}"
          echo "Rush Worker URL:  ${{ env.WORKER_URL }}"
          echo "================================================="
